<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/productos.css">
</head>
<body>

    <header>
        <h1>Gestión de Productos - Catálogo</h1>
    </header>

    <main>
        <!-- Buscador -->
        <section class="buscador">
            <input type="text" id="buscarProducto" placeholder="Buscar por nombre o categoría...">
        </section>

        <!-- Formulario de registro/edición -->
        <section class="formulario-producto">
            <h2>Registrar / Editar Producto</h2>
            <form id="formProducto">
                <input type="hidden" id="codigo">

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>

                <label for="categoria">Categoría:</label>
                <input type="text" id="categoria" required>

                <label for="precio">Precio:</label>
                <input type="number" id="precio" step="0.01" required>

                <label for="stock">Stock:</label>
                <input type="number" id="stock" required>

                <button type="submit">Guardar</button>
            </form>
        </section>

        <!-- Listado de productos -->
        <section class="lista-productos">
            <h2>Inventario</h2>
            <table id="tablaProductos">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Las filas se generan dinámicamente con JS -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script src="js/productos.js"></script>
</body>
</html>
